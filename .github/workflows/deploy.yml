name: deploy

on:
  push:
    branches:
    - prod

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-22.04
    steps:
    - name: Deploy
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: 200.234.232.44
        port: 2222
        username: gaston
        key: ${{ secrets.PRIVATE_KEY }}
        script: "echo 'Start deploy'; cd /var/www/html/majosfera-back; sudo -u www-data git pull origin prod; php artisan route:clear; sudo systemctl reload php8.2-fpm; sudo -u www-data npm run build; echo 'Deploy completed'"
