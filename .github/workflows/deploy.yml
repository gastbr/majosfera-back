name: deploy

on:
  push:
    branches:
    - prod

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-22.04
    steps:
    - name: Deploy
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.VPS_HOST }}
        port: 2222
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.PRIVATE_KEY }}
        script: "sudo ${{ secrets.VPS_DEPLOY_DIR }}.github/workflows/script.sh"
